<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Finanzas</title>
<meta name="theme-color" content="#b8467a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f7f4f1; --card:#ffffff; --card2:#fbf8f5; --line:#ebe5df;
  --ink:#1d1a18; --ink2:#5b5550; --ink3:#8f8780;
  --accent:#b8467a; --accent-soft:#f8e3ec; --accent-ink:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#1a8a5a; --good-soft:#e1f4ea; --bad:#c53b3b; --bad-soft:#fbe7e6; --warn:#a96a00; --warn-soft:#fdf1d8;
  --shadow:0 1px 2px rgba(30,20,10,.05),0 4px 16px rgba(30,20,10,.05);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#161413; --card:#211e1c; --card2:#1b1917; --line:#34302c;
    --ink:#f2eeea; --ink2:#c4bcb5; --ink3:#8e867f;
    --accent:#e07aa8; --accent-soft:#3a2430; --accent-ink:#1b1015;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good:#4cc08a; --good-soft:#18352a; --bad:#ef7b7b; --bad-soft:#3a1f1f; --warn:#e2a63a; --warn-soft:#3a2e15;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.month{display:flex;align-items:center;gap:6px}
.month button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:16px}
.month .lbl{font-weight:700;min-width:132px;text-align:center;text-transform:capitalize}
.quickm{display:flex;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px;font-weight:600}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:none;background:none;padding:8px 12px 10px;cursor:pointer;font-weight:600;color:var(--ink2);border-bottom:2.5px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:13.5px}
h2{font-size:22px;margin:22px 0 4px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 10px}
.sub{color:var(--ink2);margin:0 0 14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.g2.st{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.soft{background:var(--card2)}
.stat .k{font-size:12.5px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .h{font-size:12.5px;color:var(--ink3);margin-top:2px}
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#6a2b8a));color:#fff;border:none}
.hero .k,.hero .h{color:rgba(255,255,255,.85)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--ink2)} .small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.fab{position:fixed;right:20px;bottom:22px;z-index:30;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:800;box-shadow:0 6px 24px rgba(184,70,122,.4);cursor:pointer}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.bucket{margin-bottom:14px}
.bucket .row{font-size:14px;margin-bottom:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item .ico{width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12.5px;color:var(--ink3)}
.item .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayh{font-size:12.5px;font-weight:700;color:var(--ink2);margin:16px 4px 2px;display:flex;justify-content:space-between;text-transform:capitalize}
.tag.cloud.ok{background:var(--good-soft);color:var(--good);border-color:transparent}.tag.cloud.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--ink2)}
.empty{padding:28px 10px;text-align:center;color:var(--ink2)}
.empty .big{font-size:34px}
/* charts */
.hb{display:flex;flex-direction:column;gap:8px}
.hb .r{display:grid;grid-template-columns:150px 1fr 108px;align-items:center;gap:10px;font-size:13.5px;padding:2px 0;border-radius:8px}
.hb .r:hover{background:var(--card2)}
.hb .r .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .r .track{height:14px;position:relative}
.hb .r .track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1)}
.hb .r .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:520px){.hb .r{grid-template-columns:118px 1fr 92px;gap:8px}.hb .r .val{font-size:12.5px}}
svg text{fill:var(--ink3);font-size:11px;font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
#tip{position:fixed;pointer-events:none;z-index:100;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:10px;font-size:12.5px;font-weight:600;white-space:pre-line;opacity:0;transition:opacity .1s;max-width:240px}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,6,4,.45);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
@media (min-width:640px){#modal{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 22px}
@media (min-width:640px){.sheet{border-radius:22px}}
.sheet h3{font-size:19px;margin-bottom:12px}
.lbl2{font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:7px 11px;cursor:pointer;font-weight:600;font-size:13.5px}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.types .chip{text-align:center;padding:10px 6px}
.types .chip .e{display:block;font-size:20px}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 12px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent)}
input.amount{font-size:28px;font-weight:800;padding:10px 14px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:120;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
/* learn */
details.lesson{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:0 16px}
details.lesson summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson summary .n{background:var(--accent-soft);color:var(--accent);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;font-size:13px}
details.lesson[open] summary{border-bottom:1px solid var(--line)}
details.lesson .body{padding:10px 0 16px;color:var(--ink)}
details.lesson .body p{margin:8px 0}
details.lesson .body ul{margin:6px 0;padding-left:20px}
.callout{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.goal .big{font-size:26px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:none}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:none;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td:not(:first-child){white-space:nowrap}
table.t th{font-size:12px;color:var(--ink2);font-weight:700}
.insight{display:flex;gap:10px;padding:8px 0;font-size:14px}
.insight .e{font-size:18px}
.loading{padding:60px 0;text-align:center;color:var(--ink2)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="row" style="gap:8px;flex-wrap:wrap"><h1>Mis Finanzas <span>· <span id="hname">Narda</span></span></h1><span id="cloud" class="tag cloud">…</span></div>
      <div class="month">
        <button id="mprev" aria-label="Mes anterior">‹</button>
        <div class="lbl" id="mlbl"></div>
        <button id="mnext" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<div class="wrap">
  <div id="banner"></div>
  <main id="view"><div class="loading">Cargando tus finanzas…</div></main>
</div>
<button class="fab" id="fab">＋ Registrar</button>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="tip"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
/* ======================================================================
   OPCIONAL: pega aquí tu "ID de cliente" de Google (paso 5 de la guía)
   para no tener que escribirlo en cada dispositivo. Ejemplo:
   const DEFAULT_CLIENT_ID = '123456789-abc123.apps.googleusercontent.com';
   ====================================================================== */
const DEFAULT_CLIENT_ID = '80377924295-rvnbdlnnaup8ge8u2to11vrsrd8pl924.apps.googleusercontent.com';
/* ============ Config ============ */
const DEF_GASTO = [
  {id:'pasajes', n:'Transporte', e:'🚌', g:'nec', d:'Pasajes, combi, metro, taxi o colectivo para moverte.'},
  {id:'comida', n:'Comida del día', e:'🍽️', g:'nec', d:'Desayuno, menú, almuerzo o mercado: lo que comes porque lo necesitas.'},
  {id:'familia', n:'Familia', e:'👨‍👩‍👧', g:'nec', d:'Lo que aportas en casa o das para ayudar a tu familia.'},
  {id:'casa', n:'Vivienda y servicios', e:'🏠', g:'nec', d:'Alquiler, luz, agua, gas y cosas para la casa.'},
  {id:'celular', n:'Celular e internet', e:'📶', g:'nec', d:'Recargas, plan del celular, wifi.'},
  {id:'salud', n:'Salud', e:'💊', g:'nec', d:'Medicinas, consultas, análisis, lentes. Solo salud, no belleza.'},
  {id:'estudios', n:'Estudios', e:'📚', g:'nec', d:'Pensión, cursos, materiales, copias, libros.'},
  {id:'salidas', n:'Salidas con amigos', e:'🎉', g:'gus', d:'Planes con gente: cine, discoteca, comer fuera con amigas, fiestas.'},
  {id:'gustitos', n:'Antojos', e:'🧋', g:'gus', d:'Lo que compras para ti sola sin necesitarlo: snacks, café, dulces, bubble tea.'},
  {id:'ropa', n:'Ropa y accesorios', e:'👗', g:'gus', d:'Ropa, zapatillas, carteras, joyería.'},
  {id:'cuidado', n:'Belleza y cuidado', e:'💅', g:'gus', d:'Uñas, skincare, maquillaje, peluquería, perfumes.'},
  {id:'apps', n:'Suscripciones y apps', e:'📺', g:'gus', d:'Pagos que se repiten: IA, CapCut, Spotify, Netflix (si son por gusto).'},
  {id:'regalos', n:'Regalos', e:'🎁', g:'gus', d:'Lo que compras para OTRAS personas: cumpleaños, Navidad, detalles.'},
  {id:'negocio', n:'Mi negocio / app', e:'🚀', g:'fut', d:'Inversión en tu proyecto: herramientas, IA o CapCut para trabajar, cursos de emprendimiento, diseño.'},
  {id:'otros', n:'Varios', e:'🎲', g:'gus', d:'Solo lo que no encaja en ninguna otra. Si algo se repite aquí, créale su propia categoría.'},
];
const DEF_ING = [
  {id:'sueldo', n:'Sueldo / pago fijo', e:'💼', d:'Lo que te pagan regularmente por tu trabajo.'},
  {id:'extra', n:'Trabajos extra', e:'💻', d:'Freelance, cachuelos, proyectos sueltos.'},
  {id:'ventas', n:'Ventas', e:'🛍️', d:'Dinero por vender productos o servicios.'},
  {id:'regalo', n:'Regalos / propinas', e:'🎁', d:'Dinero que te regalan (cumpleaños, Navidad, propinas).'},
  {id:'otros_i', n:'Otros ingresos', e:'🎲', d:'Lo que no encaja en lo anterior.'},
];
function allCats(){ const c=S.settings.cats; return (c && Array.isArray(c.gasto) && Array.isArray(c.ingreso)) ? c : {gasto:DEF_GASTO, ingreso:DEF_ING}; }
function GC(){ return allCats().gasto; }
function IC(){ return allCats().ingreso; }
const GROUPS = {
  nec:{n:'Necesidades', d:'pasajes, comida, familia, casa…', c:'var(--s1)'},
  gus:{n:'Gustos', d:'salidas, ropa, antojos, apps…', c:'var(--s2)'},
  fut:{n:'Ahorro y futuro', d:'metas + inversión en tu negocio', c:'var(--s3)'},
};
const METHODS = {efectivo:{n:'Efectivo', e:'💵'}, digital:{n:'Digital', e:'📱'}, tarjeta:{n:'Tarjeta de crédito', e:'💳'}};
const TYPES = {
  gasto:{n:'Gasté', e:'💸', sign:-1},
  ingreso:{n:'Me ingresó', e:'💰', sign:1},
  ahorro:{n:'Ahorré', e:'🐷', sign:-1},
  transfer:{n:'Moví dinero', e:'🔄', sign:0},
  pagoTarjeta:{n:'Pagué tarjeta', e:'💳', sign:-1},
  retiroMeta:{n:'Saqué de meta', e:'↩️', sign:1},
  prestamoDado:{n:'Presté', e:'🤝', sign:-1},
  prestamoRecibido:{n:'Me prestaron', e:'🤝', sign:1},
  cobro:{n:'Me pagaron deuda', e:'✅', sign:1},
  pagoDeuda:{n:'Pagué deuda', e:'✅', sign:-1},
  cero:{n:'Día sin gastos', e:'🌱', sign:0},
};
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
const DEFAULT_SETTINGS = {name:'Narda', currency:'S/', cashStart:0, digitalStart:0, cardStart:0, income:0, pNec:50, pGus:30, pFut:20, habits:{}, configured:false};
const HABITS = [
  {id:'h1', t:'Registrar mis gastos todos los días (aunque sea “día sin gastos”)'},
  {id:'h2', t:'Separar mi ahorro apenas me ingresa dinero (págate a ti primero)'},
  {id:'h3', t:'Revisar mis suscripciones: IA, CapCut, streaming… ¿las uso cada semana?'},
  {id:'h4', t:'Contar mi efectivo cada domingo y ajustar si no cuadra'},
  {id:'h5', t:'Usar la regla de las 24 horas antes de comprar ropa o gustitos grandes'},
  {id:'h6', t:'Anotar cada préstamo (a quién, cuánto, cuándo) en Deudas'},
  {id:'h7', t:'Si uso tarjeta de crédito: pagar el TOTAL del mes, nunca solo el mínimo'},
  {id:'h8', t:'Revisar mi resumen mensual el último día del mes'},
];

/* ============ State ============ */
const S = {settings:{...DEFAULT_SETTINGS}, movs:[], debts:[], goals:[], ready:false};
const today = new Date();
const todayStr = ymd(today);
let cur = (today.getFullYear()===2026 && (today.getMonth()===10||today.getMonth()===11)) ? {y:2026,m:today.getMonth()} : {y:today.getFullYear(), m:today.getMonth()};
let view = 'inicio';
let resMode = 'semanal';
let movFilter = {q:'', type:'all'};

/* ============ Utils ============ */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0}
function money(n,sign){const c=S.settings.currency||'S/';const a=Math.abs(n);const s=a.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});return (sign&&n<0?'− ':sign&&n>0?'+ ':(n<0?'− ':''))+c+' '+s}
function money0(n){ return money(n); }
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function catOf(m){return (m.type==='ingreso'?IC():GC()).find(c=>c.id===m.cat)}
function monthKey(y,m){return y+'-'+String(m+1).padStart(2,'0')}
function inMonth(m,y,mo){return m.date && m.date.slice(0,7)===monthKey(y,mo)}
function daysIn(y,m){return new Date(y,m+1,0).getDate()}
function fmtDay(s){const d=pd(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)}
function weekStart(d){const x=new Date(d);const dw=(x.getDay()+6)%7;x.setDate(x.getDate()-dw);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800)}
function pct(a,b){return b>0?Math.round(a/b*100):0}


/* ============ Cifrado ============ */
const PBKDF2_IT=310000; const TE=new TextEncoder(), TD=new TextDecoder();
function b64(buf){ const u=buf instanceof Uint8Array?buf:new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function unb64(str){ const s=atob(str); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function deriveKey(pass, saltB64, iter){ const base=await crypto.subtle.importKey('raw', TE.encode(pass), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(saltB64), iterations:iter||PBKDF2_IT, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']); }
async function importRawKey(b){ return crypto.subtle.importKey('raw', unb64(b), {name:'AES-GCM'}, true, ['encrypt','decrypt']); }
async function encObj(obj, key){ if(!key) throw new Error('locked'); const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, TE.encode(JSON.stringify(obj))); return {enc:b64(ct), iv:b64(iv), v:1}; }
async function decObj(raw, key){ if(!raw || !raw.enc) return raw||{}; const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(raw.iv)}, key, unb64(raw.enc)); return JSON.parse(TD.decode(pt)); }
async function checkKey(key, vault){ try{ const o=await decObj(vault.check, key); return o && o.ok==='narda'; }catch(e){ return false; } }

}

function clientId(){ let v='', ok='', man=''; try{ v=(localStorage.getItem(CKEY)||'').trim(); ok=localStorage.getItem(CKEY+'-ok')||''; man=localStorage.getItem(CKEY+'-manual')||''; }catch(e){}
  const d=DEFAULT_CLIENT_ID.trim();
  if(v && (v===ok || man==='1')) return v;   // uno que ya funcionó o que la usuaria pegó a mano
  return d || v; }
function mergeData(a, b){
  if(!b) b={settings:{}, sAt:0, movs:[], debts:[], goals:[], tomb:{}};
  const tomb={...(b.tomb||{})}; for(const [k,v] of Object.entries(a.tomb||{})) tomb[k]=Math.max(v, tomb[k]||0);
  const out={tomb, sAt:Math.max(a.sAt||0,b.sAt||0)};
  out.settings = (b.sAt||0)>(a.sAt||0) ? (b.settings||{}) : (a.settings||{});
  for(const k of ['movs','debts','goals']){
    const m=new Map();
    for(const x of [...(b[k]||[]), ...(a[k]||[])]){ const prev=m.get(x.id); if(!prev || (x._u||0)>=(prev._u||0)) m.set(x.id,x); }
    out[k]=[...m.values()].filter(x=>!(tomb[k+'/'+x.id] && tomb[k+'/'+x.id]>=(x._u||0))).sort((p,q)=>String(p.id).localeCompare(String(q.id)));
  }
  const cut=Date.now()-120*864e5; for(const [k,v] of Object.entries(tomb)) if(v<cut) delete tomb[k];
  return {settings:out.settings, sAt:out.sAt, movs:out.movs, debts:out.debts, goals:out.goals, tomb:out.tomb};
}

/* ============ Calculations ============ */
function balances(){
  const st=S.settings; let cash=num(st.cashStart), dig=num(st.digitalStart), card=num(st.cardStart);
  for(const m of S.movs){
    const a=num(m.amount); const t=m.type;
    if(t==='transfer'){ if(m.method==='efectivo'){cash-=a;dig+=a}else{dig-=a;cash+=a} continue; }
    if(t==='cero') continue;
    if(t==='gasto' && m.method==='tarjeta'){ card+=a; continue; }
    if(t==='pagoTarjeta'){ card-=a; }
    const sg=TYPES[t]?TYPES[t].sign:0;
    if(m.method==='efectivo') cash+=sg*a; else if(m.method==='digital') dig+=sg*a;
  }
  return {cash, dig, card, total:cash+dig};
}
function goalSaved(g){ let s=num(g.start); for(const m of S.movs){ if(m.goalId===g.id){ if(m.type==='ahorro')s+=num(m.amount); if(m.type==='retiroMeta')s-=num(m.amount);} } return s; }
function appStart(){ return S.settings.startDate || (S.movs.map(m=>m.date).filter(Boolean).sort()[0]) || todayStr; }
function personKey(dir,name){ return dir+'|'+normName(name); }
function debtPeople(){
  const map={};
  for(const d of S.debts){
    const k=personKey(d.dir,d.person); const p=map[k]||(map[k]={key:k,dir:d.dir,name:d.person,entries:[],pend:0,last:'',due:''});
    p.entries.push(d); const a=num(d.amount);
    if(d.kind==='abono') p.pend-=a; else if(!d.paid) p.pend+=a;
    if((d.date||'')>=p.last){ p.last=d.date||''; p.name=d.person; }
    if(d.kind!=='abono' && d.due && (!p.due || d.due<p.due)) p.due=d.due;
  }
  const out=Object.values(map);
  for(const p of out){ p.entries.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||'').localeCompare(b.createdAt||'')); p.pend=Math.round(p.pend*100)/100; }
  return out;
}
function debtTotals(){ let meDeben=0, debo=0; for(const p of debtPeople()){ if(p.pend<=0) continue; if(p.dir==='meDeben') meDeben+=p.pend; else debo+=p.pend; } return {meDeben,debo}; }
function statsFor(list){
  const r={ing:0,gas:0,aho:0,neg:0,byCat:{},byGroup:{nec:0,gus:0,fut:0},byMethod:{efectivo:0,digital:0,tarjeta:0},byIngCat:{},count:0};
  for(const m of list){
    const a=num(m.amount);
    if(m.type==='ingreso'){ r.ing+=a; r.byIngCat[m.cat]=(r.byIngCat[m.cat]||0)+a; r.count++; }
    else if(m.type==='gasto'){ r.gas+=a; r.byCat[m.cat]=(r.byCat[m.cat]||0)+a; const c=GC().find(c=>c.id===m.cat); r.byGroup[c&&GROUPS[c.g]?c.g:'gus']+=a; r.byMethod[m.method||'efectivo']+=a; r.count++; if(m.cat==='negocio') r.neg+=a; }
    else if(m.type==='ahorro'){ r.aho+=a; r.byGroup.fut+=a; r.count++; }
    else if(m.type==='retiroMeta'){ r.aho-=a; r.byGroup.fut-=a; }
  }
  r.libre = r.ing - r.gas - r.aho;
  return r;
}
function monthMovs(y,m){ return S.movs.filter(x=>inMonth(x,y,m)); }
function streak(){
  const days=new Set(S.movs.map(m=>m.date)); let d=new Date(today); let n=0;
  if(!days.has(ymd(d))) d=addDays(d,-1);
  while(days.has(ymd(d))){ n++; d=addDays(d,-1); }
  return {n, todayDone: days.has(todayStr)};
}
function weeksOfMonth(y,m){
  const first=new Date(y,m,1), last=new Date(y,m,daysIn(y,m)); const out=[]; let ws=weekStart(first); let i=1;
  while(ws<=last){ const we=addDays(ws,6); const a=ws<first?first:ws, b=we>last?last:we; out.push({i:i++, from:ymd(a), to:ymd(b), a, b}); ws=addDays(ws,7); }
  return out;
}

function hbars(rows, opts={}){
  if(!rows.length) return '<div class="empty small">Aún no hay datos para este gráfico.</div>';
  const max=Math.max(...rows.map(r=>r.v))||1; const tot=rows.reduce((s,r)=>s+r.v,0);
  return '<div class="hb">'+rows.map(r=>`<div class="r" data-tip="${esc(r.label)}\n${money(r.v)} · ${pct(r.v,tot)}% del total"><div class="lab">${r.e?esc(r.e)+' ':''}${esc(r.label)}</div><div class="track"><i style="width:${Math.max(2,r.v/max*100)}%;background:${r.c||'var(--s1)'}"></i></div><div class="val">${money0(r.v)}</div></div>`).join('')+'</div>';
}
function vbars(cols, opts={}){
  // cols: [{label, v, tip, hi}]
  const W=Math.max(320, cols.length*(opts.bw||28)), H=opts.h||170, padL=44, padB=24, padT=10;
  const max=Math.max(1,...cols.map(c=>c.v)); const nice=niceMax(max);
  const iw=W-padL-6, ih=H-padB-padT; const bw=iw/cols.length; const barW=Math.max(4,Math.min(36,bw-2));
  let g='';
  for(let k=0;k<=4;k++){ const v=nice*k/4, y=padT+ih-(v/nice)*ih; g+=`<line x1="${padL}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y+4}" text-anchor="end">${shortN(v)}</text>`; }
  const step = cols.length>16? Math.ceil(cols.length/10):1;
  cols.forEach((c,i)=>{
    const h=c.v/nice*ih; const x=padL+i*bw+(bw-barW)/2; const y=padT+ih-h;
    const r=Math.min(4,barW/2, h);
    if(c.v>0) g+=`<path d="M${x},${padT+ih} V${y+r} Q${x},${y} ${x+r},${y} H${x+barW-r} Q${x+barW},${y} ${x+barW},${y+r} V${padT+ih} Z" fill="${c.hi?'var(--accent)':(opts.color||'var(--s2)')}"/>`;
    g+=`<rect x="${padL+i*bw}" y="${padT}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(c.tip||c.label+'\n'+money(c.v))}"/>`;
    if(i%step===0) g+=`<text x="${padL+i*bw+bw/2}" y="${H-7}" text-anchor="middle">${esc(c.label)}</text>`;
  });
  g+=`<line x1="${padL}" x2="${W-6}" y1="${padT+ih}" y2="${padT+ih}" stroke="var(--ink3)" stroke-width="1"/>`;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,560)}px;display:block" role="img" aria-label="${esc(opts.aria||'Gráfico de barras')}">${g}</svg></div>`;
}
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); const f=v/p; const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*p; }
function shortN(v){ return v>=1000? (v/1000).toLocaleString('es-PE',{maximumFractionDigits:1})+'k' : Math.round(v).toString(); }

    const rows=GC().map(c=>({label:c.n,e:c.e,v:s.byCat[c.id]||0,c:(GROUPS[c.g]||GROUPS.gus).c})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
    h+=`<div class="grid g2 st" style="margin-top:12px"><div class="card"><h3>Por categoría</h3><div class="legend">${Object.entries(GROUPS).map(([k,g])=>`<span><i class="dot" style="background:${g.c}"></i>${g.n}</span>`).join('')}</div>${hbars(rows)}</div>
      <div class="card"><h3>¿Con qué pagaste?</h3>${hbars(Object.entries(s.byMethod).filter(([k,v])=>v>0).map(([k,v])=>({label:METHODS[k].n,e:METHODS[k].e,v,c:'var(--s1)'})))}

    h+=`<div class="card" style="margin-top:12px"><h3>🔍 Lo que dicen tus números</h3>${insights(s, mm).map(t=>`<div class="insight"><span class="e">${t[0]}</span><span>${t[1]}</span></div>`).join('')||'<p class="muted">Registra algunos movimientos y aquí aparecerán observaciones sobre tu mes.</p>'}</div>`;
  } else {
    const a=statsFor(monthMovs(2026,10)), b=statsFor(monthMovs(2026,11));
    const row=(l,x,y,inv)=>{const d=y-x; const good= inv? d<=0 : d>=0; return `<tr><td>${l}</td><td>${money(x)}</td><td>${money(y)}</td><td class="${d===0?'':good?'pos':'neg'}">${d===0?'—':money(d,true)}</td></tr>`;};
    h+=`<div class="card"><h3>Noviembre vs Diciembre 2026</h3><table class="t"><tr><th></th><th>Noviembre</th><th>Diciembre</th><th>Diferencia</th></tr>
      ${row('⬆️ Ingresos',a.ing,b.ing)}${row('⬇️ Gastos',a.gas,b.gas,true)}${row('🐷 Ahorro',a.aho,b.aho)}${row('🧺 Necesidades',a.byGroup.nec,b.byGroup.nec,true)}${row('🎉 Gustos',a.byGroup.gus,b.byGroup.gus,true)}${row('🧮 Me sobró',a.libre,b.libre)}</table></div>`;
    const cats=GC().filter(c=>(a.byCat[c.id]||0)+(b.byCat[c.id]||0)>0);
    h+=`<div class="card" style="margin-top:12px"><h3>Por categoría</h3>${cats.length?`<table class="t"><tr><th>Categoría</th><th>Nov</th><th>Dic</th><th>Diferencia</th></tr>${cats.map(c=>row(esc(c.e+' '+c.n),a.byCat[c.id]||0,b.byCat[c.id]||0,true)).join('')}</table>`:'<p class="muted">Todavía no hay gastos en noviembre ni diciembre.</p>'}
    <p class="small muted">En diciembre suelen subir salidas y regalos (Navidad, Año Nuevo). Crea una meta “Diciembre feliz” para tener ese dinero apartado desde noviembre.</p></div>`;
  }
  return h;
}
function insights(s, mm){
  const out=[]; if(!s.count) return out;
  const top=Object.entries(s.byCat).sort((a,b)=>b[1]-a[1])[0];
  if(top){const c=GC().find(c=>c.id===top[0])||{e:'❔',n:'Sin categoría'}; out.push(['🏆',`Tu categoría más alta fue <b>${esc(c.e)} ${esc(c.n)}</b>: ${money(top[1])} (${pct(top[1],s.gas)}% de tus gastos).`]);}
  if(s.byCat.apps) out.push(['🤖',`En apps y suscripciones (IA, CapCut…) se fueron <b>${money(s.byCat.apps)}</b>. Al año serían unos ${money0(s.byCat.apps*12)}. ¿Las usas todas cada semana? Si alguna es para tu negocio, regístrala como “Mi negocio / app”.`]);
  const gus=s.byGroup.gus; if(gus>0) out.push(['🎉',`En gustos gastaste <b>${money(gus)}</b>${s.ing>0?` (${pct(gus,s.ing)}% de tus ingresos; la guía es ${S.settings.pGus}%)`:''}.`]);
  const smalls=mm.filter(m=>m.type==='gasto'&&num(m.amount)<=15&&['gustitos','otros','salidas'].includes(m.cat));
  if(smalls.length>=4) out.push(['🧋',`Tuviste <b>${smalls.length} gastitos pequeños</b> (≤ ${money0(15)}) que suman ${money(smalls.reduce((a,m)=>a+num(m.amount),0))}. Los pequeños suman más de lo que parece.`]);
  if(s.ing>0){ const r=pct(s.aho,s.ing); out.push([r>=S.settings.pFut?'🌟':'🐷', r>=S.settings.pFut?`¡Ahorraste el ${r}% de lo que te ingresó! Cumpliste tu meta de ${S.settings.pFut}%.`:`Ahorraste el ${r}% de tus ingresos. Tu meta es ${S.settings.pFut}%: te faltaron ${money0(s.ing*S.settings.pFut/100-s.aho)}.`]); }
  if(s.byMethod.tarjeta>0) out.push(['💳',`Pagaste ${money(s.byMethod.tarjeta)} con tarjeta de crédito. Asegúrate de tener ese dinero para pagar el total en la fecha de pago.`]);
  if(s.libre<0) out.push(['⚠️',`Este mes salió más dinero del que entró (${money(s.libre)}). Revisa la cajita de gustos para el próximo mes.`]);
  return out;
}

function normName(x){ return String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim(); }
function lev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function similarCats(kind, name, emoji, exceptId){
  const nn=normName(name); const out={same:null, like:[], emoji:null};
  for(const c of allCats()[kind]){ if(c.id===exceptId) continue; const cn=normName(c.n);
    if(cn===nn) out.same=c;
    else { const words=nn.split(' ').filter(w=>w.length>=4); const cw=cn.split(' ').filter(w=>w.length>=4);
      if((nn.length>=4&&cn.includes(nn))||(cn.length>=4&&nn.includes(cn))||lev(nn,cn)<=2||words.some(w=>cw.some(v=>lev(w,v)<=1))) out.like.push(c); }
    if(emoji && c.e===emoji) out.emoji=c; }
  return out;
}

/* ============ Presupuesto / Límites ============ */
const DEF_W={pasajes:.18, comida:.35, familia:.17, casa:.12, celular:.08, salud:.06, estudios:.04, salidas:.30, gustitos:.14, ropa:.20, cuidado:.15, apps:.08, regalos:.08, otros:.05, negocio:.30};
const DEF_ROLL={salidas:1, ropa:1, cuidado:1, regalos:1, negocio:1, salud:1, estudios:1};
function budgetCfg(){ return S.settings.budgets||{}; }
function hasBudgets(){ return Object.values(budgetCfg()).some(b=>num(b.amt)>0); }
function catLimit(id){ const b=budgetCfg()[id]; return b?num(b.amt):0; }
function catRoll(id){ const b=budgetCfg()[id]; return b? !!b.roll : !!DEF_ROLL[id]; }
function incomeBase(y,m){ const st=S.settings; return num(st.income)>0? num(st.income) : statsFor(monthMovs(y,m)).ing; }
function groupBudget(g, base){ const st=S.settings; const p={nec:num(st.pNec),gus:num(st.pGus),fut:num(st.pFut)}[g]||0; return base*p/100; }
function suggestBudgets(base){
  const out={}; const cats=GC().filter(c=>!c.hidden);
  for(const g of ['nec','gus']){ const list=cats.filter(c=>(c.g||'gus')===g); const ws=list.map(c=>DEF_W[c.id]??.06); const tot=ws.reduce((a,b)=>a+b,0)||1;
    list.forEach((c,i)=>{ out[c.id]={amt:Math.max(0,Math.floor(groupBudget(g,base)*ws[i]/tot*100)/100), roll:catRoll(c.id)}; }); }
  const fl=cats.filter(c=>c.g==='fut'); fl.forEach(c=>{ out[c.id]={amt:Math.max(0,Math.floor(groupBudget('fut',base)*(DEF_W[c.id]??.2)/fl.length*100)/100), roll:catRoll(c.id)}; });
  return out;
}
function spentCat(id,from,to){ let t=0; for(const m of S.movs){ if(m.type==='gasto'&&m.cat===id&&m.date>=from&&m.date<=to) t+=num(m.amount); } return t; }
function mRange(y,m){ const k=monthKey(y,m); return [k+'-01', k+'-'+String(daysIn(y,m)).padStart(2,'0')]; }
function carryFor(id,y,m){
  if(!catRoll(id)||!catLimit(id)) return 0; const st=pd(appStart()); let s=0;
  for(let k=st.getFullYear()*12+st.getMonth(); k<y*12+m; k++){ const yy=Math.floor(k/12), mm=k%12; const [a,b]=mRange(yy,mm); s+=catLimit(id)-spentCat(id,a,b); }
  return Math.round(s*100)/100;
}
function budgetRow(c,y,m){
  const lim=catLimit(c.id), carry=carryFor(c.id,y,m), avail=lim+carry; const [a,b]=mRange(y,m); const spent=spentCat(c.id,a,b); const rem=avail-spent; const dim=daysIn(y,m);
  const curM=(y===today.getFullYear()&&m===today.getMonth()); const past=new Date(y,m+1,0)<today && !curM;
  const daysLeft=curM? dim-today.getDate()+1 : (past?0:dim);
  const daily= daysLeft>0&&rem>0? rem/daysLeft : 0;
  let weekRem=null, weekAllow=null;
  if(curM){ let ws=weekStart(today); if(ws.getMonth()!==m||ws.getFullYear()!==y) ws=new Date(y,m,1); let we=addDays(weekStart(today),6); if(we.getMonth()!==m) we=new Date(y,m,dim);
    const spentBefore=spentCat(c.id,a,ymd(addDays(ws,-1))); const spentWeek=spentCat(c.id,ymd(ws),ymd(we));
    const remStart=avail-spentBefore; const dlStart=dim-ws.getDate()+1; const wd=we.getDate()-ws.getDate()+1;
    weekAllow=remStart>0? remStart*wd/dlStart : 0; weekRem=weekAllow-spentWeek; }
  const pace= curM? today.getDate()/dim : (past?1:0); const used= avail>0? spent/avail : (spent>0?2:0);
  let st='ok'; if(lim<=0&&carry<=0) st='none'; else if(rem<-0.004) st='over'; else if(used>=0.9) st='limit'; else if(used>pace+0.15) st='fast';
  return {c,lim,carry,avail,spent,rem,daily,weekRem,weekAllow,pace,used,st,daysLeft};
}
const ST={ok:{i:'🟢',t:'Vas bien',c:'var(--good)'}, fast:{i:'🟡',t:'Vas rápido',c:'var(--warn)'}, limit:{i:'🟠',t:'Casi al límite',c:'var(--warn)'}, over:{i:'🔴',t:'Te pasaste',c:'var(--bad)'}, none:{i:'⚪',t:'Sin límite',c:'var(--ink3)'}};
function budgetTotals(y,m){ const rows=GC().filter(c=>catLimit(c.id)>0||carryFor(c.id,y,m)!==0).map(c=>budgetRow(c,y,m)); const flex=rows.filter(r=>(r.c.g||'gus')!=='fut');
  return {rows, day:flex.reduce((a,r)=>a+r.daily,0), week:flex.reduce((a,r)=>a+(r.weekRem!=null?Math.max(0,r.weekRem):0),0), month:flex.reduce((a,r)=>a+Math.max(0,r.rem),0), over:rows.filter(r=>r.st==='over'||r.st==='limit')}; }
function budgetBar(r){
  const max=Math.max(r.avail, r.spent, 1); const w=Math.min(100,r.spent/max*100); const lw=r.avail>0? r.avail/max*100 : 0;
  return `<div style="position:relative;height:14px;background:var(--line);border-radius:999px;overflow:visible" data-tip="Gastado ${money(r.spent)} de ${money(r.avail)}${r.carry?` (incluye ${money(r.carry,true)} acumulado)`:''}\nLa rayita marca dónde deberías ir hoy para llegar a fin de mes">
    <i style="position:absolute;left:0;top:0;bottom:0;width:${w}%;border-radius:999px;background:${r.st==='over'?'var(--bad)':r.st==='limit'||r.st==='fast'?'var(--warn)':(GROUPS[r.c.g]||GROUPS.gus).c}"></i>
    ${r.pace>0&&r.pace<1&&r.avail>0?`<b style="position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:calc(${Math.min(100,r.pace*lw)}% - 1px);border-radius:2px"></b>`:''}
  </div>`;
}
function vPresupuesto(){
  const y=cur.y,m=cur.m; const base=incomeBase(y,m); const curM=(y===today.getFullYear()&&m===today.getMonth());
  let h=`<h2>Mis límites de gasto 💰</h2><p class="sub">Cuánto puedes gastar en cada cosa, según tu ingreso y la regla 50/30/20. Si no gastas, <b>lo que sobra se acumula</b> para después (en las categorías con 🐷).</p>`;

  for(const g of ['nec','gus','fut']){

      </div>`;
    }

  }
  h+=`<div class="row" style="flex-wrap:wrap"><button class="btn pri" data-act="budedit">✏️ Ajustar mis límites</button></div>`;

function readMovInputs(){ const a=document.getElementById('f-amt'); if(a)F.amount=a.value; const d=document.getElementById('f-date'); if(d&&d.value)F.date=d.value; const n=document.getElementById('f-note'); if(n)F.note=n.value; }
async function saveMov(){
  readMovInputs(); const err=document.getElementById('f-err');
  const amt=num(F.amount);
  if(F.type!=='cero' && !(amt>0)){ err.textContent='Escribe un monto mayor a 0.'; return; }
  if((F.type==='gasto'||F.type==='ingreso') && !F.cat){ err.textContent='Elige una categoría.'; return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(F.date)){ err.textContent='Elige una fecha.'; return; }
  if(F.type==='pagoTarjeta' && F.method==='tarjeta') F.method='efectivo';
  if(F.type!=='gasto' && F.method==='tarjeta') F.method='efectivo';
  const o={id:F.id||uid('m'), type:F.type, amount:Math.round(amt*100)/100, cat:(F.type==='gasto'||F.type==='ingreso')?F.cat:'', method:F.type==='cero'?'':F.method, goalId:(F.type==='ahorro'||F.type==='retiroMeta')?F.goalId:'', date:F.date, note:(F.note||'').trim().slice(0,140), createdAt:F.createdAt||new Date().toISOString()};
  const btn=sheet.querySelector('[data-act="savemov"]'); if(btn){btn.disabled=true;btn.textContent='Guardando…';}
  const isEdit=!!F.id; let msg=isEdit?'Cambios guardados ✓':'¡Guardado! ✓';
  if(!isEdit && o.type==='gasto' && catLimit(o.cat)>0){ const d0=pd(o.date); const c=GC().find(x=>x.id===o.cat); if(c){ const after=budgetRow(c,d0.getFullYear(),d0.getMonth()).rem-o.amount; msg = after>=0? `✓ Te quedan ${money0(after)} en ${c.n}` : `⚠️ Te pasaste ${money0(-after)} en ${c.n}`; } }
  const ok=await store.put('movs',o);
  if(ok){ closeModal(); toast(msg); }
  else if(btn){ btn.disabled=false; btn.textContent='Guardar ✓'; }
  // move month view to the saved date's month
  const d=pd(o.date); if(ok && (d.getMonth()!==cur.m||d.getFullYear()!==cur.y)){ cur={y:d.getFullYear(),m:d.getMonth()}; render(); }
}

function movTypeFor(dir,kind){ return kind==='abono' ? (dir==='meDeben'?'cobro':'pagoDeuda') : (dir==='meDeben'?'prestamoDado':'prestamoRecibido'); }
function movNoteFor(dir,kind,person,note){ return (kind==='abono'?(dir==='meDeben'?'Pago de ':'Pago a '):(dir==='meDeben'?'Préstamo a ':'Préstamo de '))+person+(note?' · '+note:''); }

function personTotals(p){ let cargo=0, abono=0; for(const d of p.entries){ const a=num(d.amount); if(d.kind==='abono') abono+=a; else { cargo+=a; if(d.paid) abono+=a; } } return {cargo:Math.round(cargo*100)/100, abono:Math.round(abono*100)/100}; }
function dmy(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
function statementText(p){
  const me=S.settings.name||'Narda'; const t=personTotals(p); const isMe=p.dir==='meDeben';
  const cargos=p.entries.filter(d=>d.kind!=='abono'), abonos=p.entries.filter(d=>d.kind==='abono'||d.paid);
  const line=(d,amt)=>`• ${dmy(d.kind==='abono'?d.date:(d.paid?d.paidDate||d.date:d.date))} — ${money(amt)}${d.note?' ('+d.note+')':''}`;
  let L=[];
  L.push(isMe? `Hola ${p.name} 👋, te comparto el detalle de lo que tenemos pendiente:` : `Hola ${p.name} 👋, te comparto el detalle de lo que te debo:`);
  L.push('');
  L.push(isMe? '🤝 Lo que te presté:' : '🤝 Lo que me prestaste:');
  cargos.forEach(d=>L.push(`• ${dmy(d.date)} — ${money(num(d.amount))}${d.note?' ('+d.note+')':''}`));
  if(abonos.length){ L.push(''); L.push(isMe? '✅ Lo que ya me pagaste:' : '✅ Lo que ya te pagué:'); abonos.forEach(d=>L.push(line(d,num(d.amount)))); }
  L.push(''); L.push('━━━━━━━━━━━━');
  L.push(`Total ${isMe?'prestado':'que me prestaste'}: ${money(t.cargo)}`);
  L.push(`Total pagado: ${money(t.abono)}`);
  L.push(p.pend>0? `💰 ${isMe?'Pendiente por pagarme':'Te debo todavía'}: ${money(p.pend)}` : '✅ ¡Estamos al día! Gracias 🙌');
  if(p.pend>0 && p.due) L.push(`📅 Fecha acordada: ${dmy(p.due)}`);
  L.push(''); L.push(p.pend>0? (isMe?`¡Gracias! 😊 — ${me}`:`Te voy pagando lo antes posible. ¡Gracias! 😊 — ${me}`) : `— ${me}`);
  return L.join('\n');
}

}
async function saveGoal(){
  const G=sheet._goal; const err=document.getElementById('g-err');
  G.name=document.getElementById('g-name').value.trim(); G.target=num(document.getElementById('g-target').value); G.deadline=document.getElementById('g-dl').value||''; G.start=num(document.getElementById('g-start').value);
  if(!G.name){err.textContent='Ponle un nombre a tu meta.';return;} if(!(G.target>0)){err.textContent='¿Cuánto necesitas? Escribe un monto.';return;}
  const o={id:G.id||uid('g'),name:G.name.slice(0,60),emoji:G.emoji,target:G.target,deadline:G.deadline,start:G.start,createdAt:G.createdAt||new Date().toISOString()};
  if(await store.put('goals',o)){ closeModal(); toast('Meta guardada 🎯'); }
}


/* ============ Exportar a hoja de cálculo ============ */
const XT={gasto:'Gasto',ingreso:'Ingreso',ahorro:'Ahorro (a meta)',retiroMeta:'Saqué de meta',pagoTarjeta:'Pago de tarjeta'};
const XM={efectivo:'Efectivo',digital:'Digital',tarjeta:'Tarjeta de crédito'};
const XG={nec:'Necesidades',gus:'Gustos',fut:'Ahorro y futuro'};
function tsv(rows){ return rows.map(r=>r.map(x=>x==null?'':String(x).replace(/[\t\n\r]+/g,' ')).join('\t')).join('\n'); }
function n2(x){ return (Math.round(num(x)*100)/100).toFixed(2); }
function exportData(kind){
  const st=S.settings;
  if(kind==='config') return tsv([[st.name||'Narda'],[st.currency||'S/'],[n2(st.cashStart)],[n2(st.digitalStart)],[n2(st.cardStart)],[appStart()],[n2(st.income)],[num(st.pNec)/100],[num(st.pGus)/100],[num(st.pFut)/100]]);
  if(kind==='cats') return tsv([...GC().map(c=>[c.n, XG[c.g]||'Gustos', catLimit(c.id)?n2(catLimit(c.id)):'0', catRoll(c.id)?'Sí':'No', c.d||'']), ...IC().map(c=>[c.n,'Ingreso','','',c.d||''])]);
  if(kind==='metas') return tsv(S.goals.map(g=>[g.name, n2(g.target), g.deadline||'', n2(g.start)]));
  if(kind==='personas') return tsv(debtPeople().map(p=>[p.name, p.dir==='meDeben'?'Me debe':'Yo debo']));
  if(kind==='movs'){
    const out=[];
    for(const m of [...S.movs].sort((a,b)=>(a.date+(a.createdAt||'')).localeCompare(b.date+(b.createdAt||'')))){
      if(m.debtId || ['cero','prestamoDado','prestamoRecibido','cobro','pagoDeuda'].includes(m.type)) continue;
      const c=catOf(m); const g=S.goals.find(g=>g.id===m.goalId);
      let tipo=XT[m.type], medio=XM[m.method]||'';
      if(m.type==='transfer'){ tipo= m.method==='efectivo'?'Depósito (efectivo → digital)':'Retiro (digital → efectivo)'; medio=''; }
      if(!tipo) continue;
      out.push([m.date, tipo, (m.type==='gasto'||m.type==='ingreso')&&c?c.n:'', medio, n2(m.amount), m.note||'', (m.type==='ahorro'||m.type==='retiroMeta')&&g?g.name:'']);
    }
    return tsv(out);
  }
  if(kind==='deudas'){
    const out=[]; const lado=d=>d.dir==='meDeben'?'Me debe':'Yo debo';
    const mvOf=(d,types)=>{ const m=S.movs.find(x=>x.debtId===d.id && types.includes(x.type)); return m? (XM[m.method]||'No') : 'No'; };
    for(const p of debtPeople()) for(const d of p.entries){
      if(d.kind==='abono'){ out.push([d.date, p.name, lado(d), 'Pago', n2(d.amount), d.note||'', mvOf(d,['cobro','pagoDeuda'])]); continue; }
      out.push([d.date, p.name, lado(d), 'Préstamo', n2(d.amount), d.note||'', mvOf(d,['prestamoDado','prestamoRecibido'])]);
      if(d.paid) out.push([d.paidDate||d.date, p.name, lado(d), 'Pago', n2(d.amount), 'pagado', mvOf(d,['cobro','pagoDeuda'])]);
    }
    return tsv(out.sort((a,b)=>a[0].localeCompare(b[0])));
  }
  return '';
}
/* ============ CSV ============ */
function csvFor(list){
  const rows=[['Fecha','Tipo','Categoría','Medio','Monto','Nota']];
  for(const m of [...list].sort((a,b)=>a.date.localeCompare(b.date))){ const c=catOf(m); rows.push([m.date,(TYPES[m.type]||{}).n||m.type,c?c.n:'',m.method?(METHODS[m.method]||{}).n||m.method:'',String(num(m.amount)).replace('.',','),m.note||'']); }
  return rows.map(r=>r.map(x=>String(x).replace(/\t|\n/g,' ')).join('\t')).join('\n');
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Copiado ✓ Pégalo en Excel o Google Sheets'); }
  catch(e){ openModal(`<div class="row between"><h3 style="margin:0">Copia este texto</h3><button class="btn sm ghost" data-act="close">✕</button></div><p class="small muted">Selecciona todo y cópialo; luego pégalo en una hoja de cálculo.</p><textarea class="in" rows="12" readonly>${esc(t)}</textarea>`); }
}

  if(ds.ekind){ const P=sheet._p; const keep={amt:document.getElementById('ee-amt').value,date:document.getElementById('ee-date').value,due:document.getElementById('ee-due').value,note:document.getElementById('ee-note').value}; P.kind=ds.ekind; const d=S.debts.find(x=>x.id===P.editId); drawEntryEdit({...d,amount:keep.amt,date:keep.date,due:keep.due,note:keep.note}); return; }
  if(ds.rdir){ sheet._p.newDir=ds.rdir; sheet.querySelectorAll('[data-rdir]').forEach(b=>b.classList.toggle('on',b===el)); return; }
  if(ds.when){ const P=sheet._p; P.when=ds.when; P.method= ds.when==='antigua'?'':null; redrawWhen(); return; }
  if(ds.unlink){ const id=ds.unlink; const ms=S.movs.filter(m=>m.debtId===id); for(const m of ms) await store.del('movs',m.id); const d=S.debts.find(x=>x.id===id); if(d) await store.put('debts',{...d,old:true}); toast('Listo: ya no mueve tu saldo ✓'); if(sheet._p) drawPerson(); return; }
  if(ds.goal){ const g=S.goals.find(x=>x.id===ds.goal); if(g) openGoal({...g}); return; }
  if(ds.ge){ sheet._goal.emoji=ds.ge; sheet.querySelectorAll('[data-ge]').forEach(b=>b.classList.toggle('on',b===el)); return; }
  if(ds.preset){ const [a,b,c]=ds.preset.split(','); document.getElementById('s-pn').value=a; document.getElementById('s-pg').value=b; document.getElementById('s-pf').value=c; return; }
  if(ds.cat){ const c=allCats()[ds.kind].find(x=>x.id===ds.cat); if(c) openCat(ds.kind,{...c}); return; }
  if(ds.ke){ sheet._cat.e=ds.ke; document.getElementById('k-emoji').value=ds.ke; sheet.querySelectorAll('[data-ke]').forEach(b=>b.classList.toggle('on',b===el)); return; }
  if(ds.kg){ sheet._cat.g=ds.kg; sheet.querySelectorAll('[data-kg]').forEach(b=>b.classList.toggle('on',b===el)); return; }
  if(ds.exp){ const t=exportData(ds.exp); const where={config:'Config → B3',cats:'Categorías → A4',metas:'Metas → A4',personas:'Personas → A4',movs:'Movimientos → A4',deudas:'Deudas → A4'}[ds.exp];
    if(!t){ toast('No hay datos de este tipo todavía'); return; }
    try{ await navigator.clipboard.writeText(t); toast('Copiado ✓ Pégalo en '+where); }
    catch(_){ openModal(`<div class="row between"><h3 style="margin:0">Copia este texto</h3><button class="btn sm ghost" data-act="close">✕</button></div><p class="small muted">Selecciónalo todo, cópialo y pégalo en ${where}.</p><textarea class="in" rows="12" readonly>${esc(t)}</textarea>`); }
    return; }
  const act=ds.act;
  if(act==='driveopen') return openDriveModal();
  if(act==='bannerx'){ setBanner(''); return; }
  if(act==='savecid'||act==='driveconnect'){ const i=document.getElementById('cid'); if(i){ const v=i.value.trim(); if(v && !/\.apps\.googleusercontent\.com$/.test(v)){ document.getElementById('cid-err').textContent='Ese no parece un ID de cliente (termina en .apps.googleusercontent.com).'; return; } try{ const changed = v!==clientId(); localStorage.setItem(CKEY,v); if(changed) localStorage.setItem(CKEY+'-manual','1'); else if(v===DEFAULT_CLIENT_ID.trim()) localStorage.removeItem(CKEY+'-manual'); }catch(_){} if(!v){ document.getElementById('cid-err').textContent='Pega tu ID de cliente primero.'; return; } }
    if(act==='savecid'){ toast('ID guardado ✓'); return; } closeModal(); setBanner(''); return store.connect(true); }
  if(act==='drivedisc') return confirmBox('¿Desconectar Google Drive? Tus datos quedan en este dispositivo y en tu Drive; solo se deja de sincronizar.','Desconectar',async()=>{ store.disconnect(); toast('Drive desconectado'); });
  if(act==='syncnow'){ closeModal(); await store.sync(); toast(store.drive.status==='ok'?'☁️ Sincronizado':'No se pudo sincronizar'); render(); return; }
  if(act==='backup') return makeBackup();
  if(act==='rbgo') return doRestore();
  if(act==='rbapply') return applyRestore();
  if(act==='saveentry') return saveEntryEdit();
  if(act==='statement') return openStatement();
  if(act==='stcopy'){ const t=document.getElementById('st-text').value; try{ await navigator.clipboard.writeText(t); toast('Mensaje copiado ✓ Pégalo en WhatsApp'); }catch(_){ const ta=document.getElementById('st-text'); ta.focus(); ta.select(); toast('Selecciona y copia el texto'); } return; }
  if(act==='backperson'){ const k=sheet._p&&sheet._p.key; if(k&&debtPeople().some(x=>x.key===k)) openPerson(k); else closeModal(); return; }
  if(act==='renperson') return openRenamePerson();
  if(act==='saverename') return saveRename();
  if(act==='budsuggest'){ const inc=num(document.getElementById('bud-inc').value); if(!(inc>0)){ toast('Pon tu ingreso mensual primero'); return; } if(await store.saveSettings({income:inc, budgets:suggestBudgets(inc), startDate:S.settings.startDate||appStart()})) toast('✨ Límites creados. Ajústalos cuando quieras'); return; }
  if(act==='budedit'){ e.preventDefault(); return openBudgetEditor(); }
  if(act==='besuggest'){ const inc=num(document.getElementById('be-inc').value); if(!(inc>0)){ document.getElementById('be-err').textContent='Pon tu ingreso para sugerir.'; return; } const sg=suggestBudgets(inc); sheet.querySelectorAll('[data-bamt]').forEach(i=>{ i.value=sg[i.dataset.bamt]?sg[i.dataset.bamt].amt:''; }); beSum(); return; }
  if(act==='besave'){ const b={}; sheet.querySelectorAll('[data-bamt]').forEach(i=>{ const id=i.dataset.bamt; const r=sheet.querySelector(`[data-broll="${CSS.escape(id)}"]`); b[id]={amt:Math.round(num(i.value)*100)/100, roll:!!(r&&r.checked)}; });
    const old=budgetCfg(); for(const k in old) if(!(k in b)) b[k]=old[k];
    if(await store.saveSettings({budgets:b, income:num(document.getElementById('be-inc').value)||num(S.settings.income), startDate:S.settings.startDate||appStart()})){ closeModal(); toast('Límites guardados ✓'); } return; }
  if(act==='gocats'){ closeModal(); view='categorias'; render(); window.scrollTo({top:0}); return; }

  if(act==='savecat') return saveCat(false);
  if(act==='savecatforce') return saveCat(true);
  if(act==='delcat') return openDelCat();
  if(act==='delcatyes') return delCat();
  if(act==='resetcats') return confirmBox('¿Volver a las categorías de fábrica? Tus categorías nuevas se quitarán (sus movimientos quedarán como “Sin categoría” hasta que las vuelvas a crear).','Sí, restablecer',async()=>{ await store.saveSettings({cats:null}); toast('Categorías restablecidas'); });
  if(act==='close') return closeModal();
  if(act==='savemov') return saveMov();
  if(act==='delmov'){ const id=F.id; return confirmBox('¿Borrar este movimiento?','Sí, borrar',async()=>{ await store.del('movs',id); toast('Borrado'); }); }
